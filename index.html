<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BANKAI">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#000000">
<title>BANKAI</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Anti-rotation overlay (s'affiche en paysage) -->
<div class="rotate-lock">
  <div class="rl-icon">📱</div>
  <div class="rl-text">MODE PORTRAIT UNIQUEMENT</div>
</div>

<!-- Background -->
<div class="bg-wrap">
  <div class="bg-orb bg-orb1"></div>
  <div class="bg-orb bg-orb2"></div>
  <div class="bg-grid"></div>
</div>

<!-- App root -->
<div id="root"></div>

<!-- TIMER overlay -->
<div class="t-ov" id="tOv">
  <div class="t-bg"></div>
  <div class="t-glow"></div>
  <div class="t-content">
    <div class="t-exo-name" id="tName">—</div>
    <div class="t-ring">
      <svg class="t-svg" viewBox="0 0 188 188">
        <circle class="t-track" cx="94" cy="94" r="80"/>
        <circle class="t-prog" id="tProg" cx="94" cy="94" r="80"
          stroke-dasharray="503" stroke-dashoffset="0" stroke="#597081"/>
      </svg>
      <div class="t-center">
        <div class="t-time" id="tTime">01:30</div>
        <div class="t-sublabel">RÉCUPÉRATION</div>
      </div>
    </div>
    <div class="t-adjs">
      <button class="t-adj" onclick="adj(-15)">−15s</button>
      <button class="t-adj" onclick="adj(-30)">−30s</button>
      <button class="t-adj" onclick="adj(30)">+30s</button>
      <button class="t-adj" onclick="adj(60)">+1min</button>
    </div>
    <div class="t-ctrls">
      <button class="t-ctrl t-ctrl-ghost" onclick="closeTimer()">✕</button>
      <button class="t-ctrl t-ctrl-main" id="tPause" onclick="togglePause()">⏸</button>
      <button class="t-ctrl t-ctrl-ghost" onclick="skipTimer()">⏭</button>
    </div>
  </div>
</div>

<!-- BANKAI animation -->
<div class="bk-ov" id="bkOv" onclick="closeBankai()">
  <div class="bk-bg"></div>
  <div class="bk-radial"></div>
  <div class="bk-lines">
    <div class="bk-line" style="transform:rotate(0deg)"></div>
    <div class="bk-line" style="transform:rotate(36deg)"></div>
    <div class="bk-line" style="transform:rotate(72deg)"></div>
    <div class="bk-line" style="transform:rotate(108deg)"></div>
    <div class="bk-line" style="transform:rotate(144deg)"></div>
  </div>
  <div class="bk-content">
    <div class="bk-icon">⚔️</div>
    <div class="bk-title">BANKAI</div>
    <div class="bk-sub">SÉRIE SUIVANTE</div>
    <div class="bk-tap">APPUIE POUR CONTINUER</div>
  </div>
</div>

<!-- NEXT WEEK sheet -->
<div class="s-ov" id="nextOv">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-head">
      <div class="sh-title">SEMAINE+</div>
      <button class="sh-close" onclick="closeSheet('nextOv')">✕</button>
    </div>
    <div class="sh-body">
      <div class="sh-sub" id="nextSub"></div>
      <div id="nextContent"></div>
      <button class="confirm-btn" onclick="confirmNext()">CONFIRMER & DÉMARRER →</button>
    </div>
  </div>
</div>

<!-- HISTORY sheet -->
<div class="s-ov" id="histOv">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-head">
      <div class="sh-title">STATS</div>
      <button class="sh-close" onclick="closeSheet('histOv')">✕</button>
    </div>
    <div class="sh-body">
      <div class="sh-sub">Progression des charges & RPE par exercice</div>
      <div id="histContent"></div>
    </div>
  </div>
</div>

<!-- RECAP sheet -->
<div class="s-ov" id="recapOv">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-head">
      <div class="sh-title">RÉCAP</div>
      <button class="sh-close" onclick="closeSheet('recapOv')">✕</button>
    </div>
    <div class="sh-body">
      <div class="sh-sub" id="recapSub"></div>
      <div id="recapContent"></div>
    </div>
  </div>
</div>

<!-- BACKUP sheet -->
<div class="s-ov" id="backupOv">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-head">
      <div class="sh-title">SAUVEGARDE</div>
      <button class="sh-close" onclick="closeSheet('backupOv')">✕</button>
    </div>
    <div class="sh-body">
      <div class="sh-sub">Conserve tes données au-delà des mises à jour</div>
      <div id="backupContent"></div>
    </div>
  </div>
</div>

<!-- EXERCISE EDITOR sheet -->
<div class="s-ov" id="exoOv">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-head">
      <div class="sh-title" id="exoTitle">EXERCICE</div>
      <button class="sh-close" onclick="closeSheet('exoOv')">✕</button>
    </div>
    <div class="sh-body">
      <div class="sh-sub" id="exoSub"></div>
      <div id="exoForm"></div>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script src="app.js"></script>
</body>
</html>
